name: Update max commits in a day

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute max commits in a day
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -s -H "Authorization: bearer $GITHUB_TOKEN" \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"query":"{ user(login: \"Eyuel-G\") { contributionsCollection { contributionCalendar { weeks { contributionDays { contributionCount date } } } } } }"}' \
            https://api.github.com/graphql)

          MAX=$(echo "$RESPONSE" | python3 -c "
import json, sys
data = json.load(sys.stdin)
weeks = data['data']['user']['contributionsCollection']['contributionCalendar']['weeks']
counts = [day['contributionCount'] for week in weeks for day in week['contributionDays']]
print(max(counts))
")

          cat > profile/max-commits.json << EOF
{
  "schemaVersion": 1,
  "label": "Max commits in a day",
  "message": "$MAX",
  "color": "7aa2f7",
  "labelColor": "161b22",
  "style": "flat-square",
  "logoColor": "white"
}
EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/max-commits.json
          git commit -m "Update max commits in a day" || exit 0
          git push
