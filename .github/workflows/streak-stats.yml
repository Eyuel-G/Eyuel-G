name: Update streak stats

on:
  schedule:
    - cron: "0 * * * *"  # Runs every hour
  push:
    branches:
      - main
    paths-ignore:
      - "profile/streak.svg"
  workflow_dispatch:  # Lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=161B22&stroke=161B22&ring=7AA2F7&fire=BB9AF7&currStreakLabel=7AA2F7&user_timezone=Africa/Addis_Ababa
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push

